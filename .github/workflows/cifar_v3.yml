name: Frozen v3 CIFAR cells
on:
  workflow_dispatch:
    inputs:
      cells:
        description: 'JSON list of 1--64 frozen calibration or production cells'
        required: true
      result_tag:
        description: 'Work-in-progress immutable result-asset release'
        required: true
permissions:
  contents: read
concurrency:
  group: frozen-cifar-v3-${{ github.ref }}-${{ inputs.result_tag }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: plan
        env:
          REQUESTED_CELLS: ${{ inputs.cells }}
        run: python scripts/remote_cifar.py plan --cells "$REQUESTED_CELLS"
  cell:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    env:
      CELL_JSON: ${{ toJSON(matrix.cell) }}
      RESULT_TAG: ${{ inputs.result_tag }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Restore compatible cell checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p resume
          cell_id="$(python -c 'import json,os; from scripts.remote_cifar import cell_id; print(cell_id(json.loads(os.environ["CELL_JSON"])))')"
          gh release download "$RESULT_TAG" --pattern "cifar-$cell_id-*.tar.gz" --dir resume || echo "No prior cell archive downloaded"
      - name: Execute frozen cell
        run: timeout --signal=TERM 19000s python scripts/remote_cifar.py compute --cell "$CELL_JSON" --device cpu
      - name: Preserve completed output or latest resume checkpoint
        if: always()
        run: python scripts/remote_cifar.py pack --cell "$CELL_JSON" --job-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload immutable cell assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(outgoing/*.tar.gz outgoing/status-*.json)
          if ((${#files[@]})); then gh release upload "$RESULT_TAG" "${files[@]}"; fi
