name: Complete recorded CIFAR validation on hosted storage
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/cifar_hosted_finalization_20261021.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uskutsav-cpu/feature-topology
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Wait for the exact existing production campaigns
        run: |
          # Observation only: Python below separately requires terminal source
          # identities and complete verified archives, including on failed runs.
          test "$(gh run view 39530430490 --json headSha --jq .headSha)" = 06d5f685538e31542bbbd23a2c32cfde3c239aaf
          test "$(gh run view 39530446041 --json headSha --jq .headSha)" = 06d5f685538e31542bbbd23a2c32cfde3c239aaf
          gh run watch 39530430490 --interval 60 || true
          gh run watch 39530446041 --interval 60 || true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Check source-reconstruction and replay controls
        run: python -m pytest -q tests/test_reconstruct_cifar_provenance.py tests/test_reconstructed_cifar_freeze.py tests/test_verify_cifar.py tests/test_finalize_cifar_queue.py tests/test_remote_cifar.py tests/test_hosted_cifar_components.py
      - name: Collect unchanged cells, bind source cohorts and replay all held-out outcomes
        run: python scripts/finalize_cifar_hosted_20261021.py --repo .
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cifar-source-bound-finalization-${{ github.run_id }}
          path: |
            results/completion/cloud_cifar_finalization_20261021/**/*.json
            results/completion/cifar10_remote_queue_v3.json
            results/completion/cifar100_remote_queue_v3.json
            results/completion/cifar_validation.json
            results/completion/cifar_validation_progress.json
          if-no-files-found: warn
          retention-days: 30
