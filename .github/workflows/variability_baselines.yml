name: Additional variability baselines
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/variability_baselines.yml
      - scripts/remote_variability_baselines.py
      - src/metrics/variability.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: variability-baselines-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            requirements.lock.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Evaluate VCI on the frozen grid without training
        run: python scripts/remote_variability_baselines.py --output variability-evaluation --shard ${{ matrix.shard }} --shards 4
      - name: Retain source-bound additional research outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: variability-baselines-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: variability-evaluation/
          if-no-files-found: error
          retention-days: 30
