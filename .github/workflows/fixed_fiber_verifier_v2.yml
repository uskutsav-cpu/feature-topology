name: Fixed smooth-fiber verification
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/fixed_fiber_verifier_v2.yml
      - scripts/remote_fixed_fiber_verifier.py
      - src/metrics/fixed_fiber_verifier.py
      - configs/fixed_fiber_verifier_v2.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gamma: [0.03125, 0.5, 1.0, 8.0]
        theta: [1, 3, 5, 7]
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            docs
            tests
            requirements.lock.txt
            requirements.certification.txt
            results/continuous_fiber_feasibility
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.certification.txt
      - run: python -m pip install -r requirements.lock.txt -r requirements.certification.txt
      - name: Check arithmetic, negative controls, and task-coordinate scope
        run: python -m pytest -q tests/test_fixed_fiber_verifier.py tests/test_continuous_fiber_affine_verifier.py tests/test_continuous_fiber_verifier.py
      - name: Verify one complete smooth circle
        run: python scripts/remote_fixed_fiber_verifier.py --output fixed-fiber-verification --gamma ${{ matrix.gamma }} --theta-numerator ${{ matrix.theta }}
      - name: Recompute every positive certificate in a separate process
        run: python scripts/remote_fixed_fiber_verifier.py --output fixed-fiber-verification --gamma ${{ matrix.gamma }} --theta-numerator ${{ matrix.theta }} --replay
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-fiber-gamma-${{ matrix.gamma }}-theta-${{ matrix.theta }}-${{ github.run_id }}
          path: fixed-fiber-verification/
          if-no-files-found: error
          retention-days: 30
