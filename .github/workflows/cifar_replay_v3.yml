name: Frozen v3 CIFAR replay audit
on:
  workflow_dispatch:
    inputs:
      cell:
        description: 'One frozen production cell as JSON'
        required: true
      archive:
        description: 'Exact immutable production archive asset name'
        required: true
      status:
        description: 'Exact immutable production status asset name'
        required: true
      source_tag:
        description: 'Immutable production artifact release tag'
        required: true
      expected_commit:
        description: 'Production source commit bound by the release tag'
        required: true
      audit_tag:
        description: 'Immutable replay-audit release tag'
        required: true
permissions:
  contents: read
jobs:
  replay:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CELL_JSON: ${{ inputs.cell }}
      ARCHIVE: ${{ inputs.archive }}
      STATUS: ${{ inputs.status }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      AUDIT_TAG: ${{ inputs.audit_tag }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Download exact immutable production cell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming outgoing
          gh release download "$SOURCE_TAG" --pattern "$ARCHIVE" --pattern "$STATUS" --dir incoming
      - name: Replay and bind held-out evaluation
        run: |
          run_id="$(python -c 'import json,os; from scripts.remote_cifar import config_for,fingerprint; print(fingerprint(config_for(json.loads(os.environ["CELL_JSON"]))))')"
          python scripts/audit_cifar_replay.py --repo . --cell "$CELL_JSON" \
            --archive "incoming/$ARCHIVE" --status "incoming/$STATUS" \
            --expected-commit "$EXPECTED_COMMIT" --output "outgoing/replay-$run_id-$GITHUB_RUN_ID.json"
      - name: Upload immutable replay audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(outgoing/replay-*.json)
          if ((${#files[@]})); then gh release upload "$AUDIT_TAG" "${files[@]}"; fi
