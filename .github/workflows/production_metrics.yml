name: Production metrics batch
on:
  workflow_dispatch:
    inputs:
      index_path:
        description: 'Committed, checksum-verified input index for one synthetic data condition'
        required: true
        default: configs/completion/primary_inputs.json
      run_ids:
        description: 'JSON list of at most 24 run IDs; [] selects the first 24'
        required: true
        default: '[]'
      input_tag:
        description: 'Verified training-input release'
        required: true
        default: primary-inputs-2026-09-13
      result_tag:
        description: 'Work-in-progress metric asset release'
        required: true
        default: primary-metrics-linux-2026-09-13
permissions:
  contents: read
concurrency:
  # Retries/batches writing to one result release remain serialized. Independent
  # cohorts use distinct releases and can occupy a second eight-worker lane.
  group: synthetic-production-${{ github.ref }}-${{ inputs.result_tag }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    outputs:
      run_ids: ${{ steps.plan.outputs.run_ids }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: plan
        env:
          REQUESTED_RUN_IDS: ${{ inputs.run_ids }}
          INPUT_INDEX: ${{ inputs.index_path }}
        run: python scripts/remote_metrics.py plan --index "$INPUT_INDEX" --run-ids "$REQUESTED_RUN_IDS"
  metrics:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        run_id: ${{ fromJSON(needs.plan.outputs.run_ids) }}
    env:
      RUN_ID: ${{ matrix.run_id }}
      INPUT_TAG: ${{ inputs.input_tag }}
      RESULT_TAG: ${{ inputs.result_tag }}
      INPUT_INDEX: ${{ inputs.index_path }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify public repository and download frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          gh release download "$INPUT_TAG" --pattern "$RUN_ID.tar.gz" --pattern analysis_data.npz --dir incoming
          mkdir -p resume
          gh release download "$RESULT_TAG" --pattern "metrics-$RUN_ID-*.tar.gz" --dir resume || echo "No previous metric archive downloaded"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Compute full-resolution trajectory
        run: timeout --signal=TERM 19000s python scripts/remote_metrics.py compute --index "$INPUT_INDEX" --run-id "$RUN_ID"
      - name: Preserve completed checkpoints and partial PH cache
        if: always()
        run: python scripts/remote_metrics.py pack --index "$INPUT_INDEX" --run-id "$RUN_ID" --job-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload measured outputs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(outgoing/*.tar.gz outgoing/status-*.json)
          if ((${#files[@]})); then gh release upload "$RESULT_TAG" "${files[@]}"; fi
