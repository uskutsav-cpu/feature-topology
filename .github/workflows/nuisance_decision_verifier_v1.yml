name: Nuisance decision verification
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/nuisance_decision_verifier_v1.yml
      - scripts/remote_nuisance_decision_verifier.py
      - src/metrics/nuisance_decision_verifier.py
      - configs/nuisance_decision_verifier_v1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gamma: [0.03125, 0.5, 1.0, 8.0]
        theta: [1, 3, 5, 7]
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            docs
            tests
            .github
            requirements.lock.txt
            requirements.certification.txt
            results/continuous_fiber_feasibility
            results/fixed_fiber_verification_v4
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.certification.txt
      - run: python -m pip install -r requirements.lock.txt -r requirements.certification.txt
      - name: Check full centered encoding, ties, counterexamples, and scope
        run: python -m pytest -q tests/test_nuisance_decision_verifier.py
      - name: Verify correct class on one complete circle
        run: python scripts/remote_nuisance_decision_verifier.py --output nuisance-decision-verification --gamma ${{ matrix.gamma }} --theta-numerator ${{ matrix.theta }}
      - name: Replay every positive certificate or negative point claim
        run: python scripts/remote_nuisance_decision_verifier.py --output nuisance-decision-verification --gamma ${{ matrix.gamma }} --theta-numerator ${{ matrix.theta }} --replay
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuisance-decision-gamma-${{ matrix.gamma }}-theta-${{ matrix.theta }}-${{ github.run_id }}
          path: nuisance-decision-verification/
          if-no-files-found: error
          retention-days: 30
