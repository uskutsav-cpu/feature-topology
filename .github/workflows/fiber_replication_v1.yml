name: Fixed fiber independent-seed replication
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/fiber_replication_v1.yml
      - scripts/remote_fiber_replication.py
      - scripts/validate_fiber_replication_screens.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        gamma: [0.03125, 0.5, 1.0, 8.0]
        seed: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        theta: [1, 3, 5, 7]
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            docs
            tests
            .github
            requirements.lock.txt
            requirements.certification.txt
            results/fiber_replication_screens_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.certification.txt
      - run: python -m pip install -r requirements.lock.txt -r requirements.certification.txt
      - name: Check verifier controls and fixed replication grid
        run: python -m pytest -q tests/test_nuisance_decision_verifier.py tests/test_rational_fixed_fiber_verifier.py tests/test_fiber_replication_plan.py tests/test_fiber_replication_worker.py
      - name: Verify both properties on the recorded circle
        run: python scripts/remote_fiber_replication.py --output fiber-replication --gamma ${{ matrix.gamma }} --seed ${{ matrix.seed }} --theta-numerator ${{ matrix.theta }}
      - name: Separately replay all certified claims
        run: python scripts/remote_fiber_replication.py --output fiber-replication --gamma ${{ matrix.gamma }} --seed ${{ matrix.seed }} --theta-numerator ${{ matrix.theta }} --replay
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fiber-replication-gamma-${{ matrix.gamma }}-seed-${{ matrix.seed }}-theta-${{ matrix.theta }}-${{ github.run_id }}
          path: fiber-replication/
          if-no-files-found: error
          retention-days: 30
