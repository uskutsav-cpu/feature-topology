name: Verify complete archived primary inputs
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/primary_archive_audit_20261021.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primary-archive-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts/recover_release_evidence.py
            tests/test_release_evidence.py
            configs/completion/primary_inputs_v3.json
            results/completion/remote_collections/primary.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Check the unchanged streaming verifier
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q tests/test_release_evidence.py
      - name: Read authoritative release asset identities
        run: |
          gh api --paginate --slurp 'repos/${{ github.repository }}/releases?per_page=100' > release-pages.json
          python -c 'import json; p=json.load(open("release-pages.json")); json.dump([r for page in p for r in page],open("release-catalog.json","w"))'
      - name: Hash every primary input and metric archive and member
        run: |
          python scripts/recover_release_evidence.py \
            --index configs/completion/primary_inputs_v3.json \
            --collector results/completion/remote_collections/primary.json \
            --release-catalog release-catalog.json \
            --output evidence/primary --workers 4
      - name: Preserve complete receipts or partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primary-full-archive-audit-${{ github.run_id }}
          path: |
            evidence/
            release-catalog.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
