name: Frozen checkpoint alias audit
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/checkpoint_equivalence.yml
      - scripts/remote_checkpoint_equivalence.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            requirements.lock.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Verify every tensor in the selected and final model states
        run: python scripts/remote_checkpoint_equivalence.py --output checkpoint-aliases --shard ${{ matrix.shard }} --shards 4
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-aliases-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: checkpoint-aliases/
          if-no-files-found: error
          retention-days: 30
