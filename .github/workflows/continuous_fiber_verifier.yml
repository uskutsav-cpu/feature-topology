name: Continuous fiber verification attempt
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/continuous_fiber_verifier.yml
      - scripts/remote_continuous_fiber_verifier.py
      - src/metrics/continuous_fiber_verifier.py
      - configs/continuous_fiber_verifier_v1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gamma: [0.03125, 0.5, 1.0, 8.0]
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            docs
            tests
            requirements.lock.txt
            requirements.certification.txt
            results/continuous_fiber_feasibility
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.certification.txt
      - run: python -m pip install -r requirements.lock.txt -r requirements.certification.txt
      - name: Check positive, quotient, double-cover, and cover-integrity controls
        run: python -m pytest -q tests/test_continuous_fiber_verifier.py
      - name: Attempt rigorous bounds with the fixed readout
        run: python scripts/remote_continuous_fiber_verifier.py --output continuum-verification --gamma ${{ matrix.gamma }}
      - name: Standalone replay of any positive certificate
        run: python scripts/remote_continuous_fiber_verifier.py --output continuum-verification --gamma ${{ matrix.gamma }} --replay
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-verification-gamma-${{ matrix.gamma }}-${{ github.run_id }}
          path: continuum-verification/
          if-no-files-found: error
          retention-days: 30
