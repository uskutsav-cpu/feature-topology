name: Recover verified analysis evidence
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/recover_evidence.yml
      - scripts/recover_release_evidence.py
      - tests/test_release_evidence.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            tests/test_release_evidence.py
            configs
            results/completion
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Check the streaming verifier
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q tests/test_release_evidence.py
      - name: Read authoritative release asset identities
        run: |
          gh api --paginate --slurp 'repos/${{ github.repository }}/releases?per_page=100' > release-pages.json
          python -c 'import json; p=json.load(open("release-pages.json")); json.dump([r for page in p for r in page],open("release-catalog.json","w"))'
      - name: Recover synthetic ablation JSON with complete archive hashing
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          registry=json.loads(pathlib.Path('configs/completion/production_cohorts_v3.json').read_text())
          for cohort in registry['cohorts']:
              # The primary cohort is being recovered locally with reusable,
              # checksum-matching historical JSON. This job recovers ablations.
              if cohort['name']=='primary':
                  continue
              command=[sys.executable,'scripts/recover_release_evidence.py',
                       '--index',cohort['index'],
                       '--collector',f"results/completion/remote_collections/{cohort['name']}.json",
                       '--release-catalog','release-catalog.json',
                       '--output',f"evidence/{cohort['name']}",'--workers','4']
              subprocess.run(command,check=True)
          PY
      - name: Retain verified evidence and audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feature-topology-json-evidence-${{ github.run_id }}
          path: |
            evidence/
            release-catalog.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
