name: Collect source-bound hosted task fibers
on:
  push:
    branches: [codex/neural-networks-preparation]
    paths:
      - .github/workflows/task_fiber_hosted_collection_v1.yml
  workflow_dispatch:
    inputs:
      workflow_run:
        description: Recorded hosted evaluation workflow
        required: true
        default: '39535434835'
      source_commit:
        description: Exact hosted evaluation source
        required: true
        default: '7df70ce8422964953cfedebe18d44f916a6bfe40'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uskutsav-cpu/feature-topology
      RECORDED_RUN: ${{ inputs.workflow_run || '39535434835' }}
      RECORDED_SOURCE: ${{ inputs.source_commit || '7df70ce8422964953cfedebe18d44f916a6bfe40' }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            src
            configs
            docs
            tests
            research_ext
            requirements.lock.txt
            requirements.certification.txt
            results/production_noise_completion_v1
            results/task_preserving_replay_attempts_v1
          sparse-checkout-cone-mode: false
      - name: Wait only for the recorded unchanged evaluation campaign
        run: |
          test "$(gh run view "$RECORDED_RUN" --json headSha --jq .headSha)" = "$RECORDED_SOURCE"
          gh run watch "$RECORDED_RUN" --interval 60 --exit-status
          test "$(gh run view "$RECORDED_RUN" --json headSha --jq .headSha)" = "$RECORDED_SOURCE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.certification.txt
      - run: python -m pip install -r requirements.lock.txt -r requirements.certification.txt
      - run: python -m pytest -q tests/test_hosted_task_fiber_execution.py tests/test_task_fiber_statistics.py tests/test_task_fiber_replay_metadata.py
      - name: Collect every model and execution receipt
        run: |
          gh run download "$RECORDED_RUN" --pattern 'task-fiber-hosted-shard-*' --dir work/hosted-task-artifacts
          python scripts/collect_hosted_task_fibers.py --repo . --artifacts work/hosted-task-artifacts --output results/task_preserving_fiber_completion_hosted_v1 --workflow-run "$RECORDED_RUN" --source-commit "$RECORDED_SOURCE"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-fiber-checked-collection-${{ github.run_id }}
          path: results/task_preserving_fiber_completion_hosted_v1/
          if-no-files-found: warn
          retention-days: 30
